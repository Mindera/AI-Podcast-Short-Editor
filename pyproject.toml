[project]
name = "shorts"
version = "0.1.0"
description = "Turn a long podcast video into branded vertical shorts with word-by-word captions"
readme = "README.md"
license = "SUL-1.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.1",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "pillow>=10.4",
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.7",
]

[project.scripts]
shorts = "shorts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
